# Build and publish Whisper Batch.app via gui/scripts/release.sh on an Apple Silicon runner.
#
# Release: merge a PR into main that carries one of these labels
#   release        -> next patch version (0.1.0 -> 0.1.1)
#   release:minor  -> next minor version (0.1.0 -> 0.2.0)
#   release:major  -> next major version (0.1.0 -> 1.0.0)
# Test run: Actions -> Release -> Run workflow (dry run by default: builds, publishes nothing).
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run (build and test only, publish nothing)
        type: boolean
        default: true

concurrency: release

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       (contains(github.event.pull_request.labels.*.name, 'release') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))
    runs-on: macos-15  # Apple Silicon (MLX has arm64 wheels only)
    timeout-minutes: 60
    permissions:
      contents: write  # push the version commit + tag, create the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose version bump
        id: bump
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            args+=("$INPUT_BUMP")
            [[ "$INPUT_DRY_RUN" == true ]] && args+=(--dry-run)
          elif grep -q '"release:major"' <<< "$LABELS"; then
            args+=(major)
          elif grep -q '"release:minor"' <<< "$LABELS"; then
            args+=(minor)
          else
            args+=(patch)
          fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gui/scripts/release.sh ${{ steps.bump.outputs.args }}

      - name: Keep the DMG of a dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dmg-dry-run
          path: gui/dist/WhisperBatch-*-macOS-arm64.dmg
          retention-days: 7
