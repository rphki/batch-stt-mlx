# Generated with Briefcase 0.4.7 (briefcase-template v0.4.7), trimmed to macOS arm64.
[tool.briefcase]
project_name = "batch-stt-app"
bundle = "com.rphki"
version = "0.1.1"
url = "https://aporeo.com/en/articles/mlx-whisper-batch"
license = "MIT"
license-files = ["../LICENSE"]
author = "Raphael Kirchner"
author_email = "raphael.kirchner@gmail.com"

[tool.briefcase.app.batch_stt_app]
formal_name = "BatchSTT"
icon = "icons/batch-stt"  # regenerate with scripts/make_icon.py
description = "Batch transcription of dictation archives on Apple Silicon"
long_description = """Transcribe folders of voice recordings locally with mlx-whisper.
"""
sources = [
    "src/batch_stt_app",
]
requires = [
    # Core package from the repo root (CLI + transcription logic)
    "../",
]
test_sources = [
    "tests",
]
test_requires = [
    "pytest",
    "toga-dummy~=0.5.0",
]

[tool.briefcase.app.batch_stt_app.macOS]
# MLX ships arm64 wheels only
universal_build = false
min_os_version = "14.0"
requires = [
    "toga-cocoa~=0.5.0",
    "std-nslog~=2.0.0",
]

[tool.briefcase.app.batch_stt_app.macOS.info]
# Controls (progress bar, switches, selection) use the icon's orange instead of
# system blue; the colour lives in assets/Assets.xcassets, compiled by build_dmg.sh
NSAccentColorName = "AccentColor"
